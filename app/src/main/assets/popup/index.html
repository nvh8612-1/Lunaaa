<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunaa Popup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: transparent; overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Bong bóng mini bám mép màn hình */
    #miniBubbleWrap {
      position: fixed; left: 6px; top: 40%; width: 40px; height: 40px;
      touch-action: none; cursor: grab; z-index: 9999;
      transition: left 0.28s cubic-bezier(0.22, 1, 0.36, 1), top 0.2s ease, opacity 0.35s ease;
    }
    #miniBubbleWrap.dragging { transition: none; cursor: grabbing; }
    #miniBubbleWrap.is-peeking { opacity: 0.38; }
    .mini-float { animation: floatGentle 3.6s ease-in-out infinite; will-change: transform; }
    .mini-bubble {
      --voice: 0; width: 40px; height: 40px; border-radius: 50%; padding: 2px;
      position: relative; display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(56,189,248,.55), rgba(168,85,247,.45), rgba(52,211,153,.55));
      border: 1.5px solid rgba(255,255,255,.75);
      box-shadow: 0 0 calc(var(--voice) * 14px) calc(var(--voice) * 3px) rgba(34,197,94,calc(var(--voice) * .92)), 0 4px 12px rgba(15,23,42,.25);
      transform: scale(calc(1 + var(--voice) * .14)); overflow: hidden;
    }
    .mini-bubble img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .unread-badge {
      position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px; background: #dc2626; color: #fff; font-size: 11px; font-weight: 700;
      display: none; place-items: center;
    }
    .unread-badge.show { display: grid; }
    @keyframes floatGentle { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(0,-4px,0); } }

    /* Popup mở */
    .popup-backdrop {
      position: fixed; inset: 0; display: none; place-items: center;
      background: rgba(2,6,23,.35); z-index: 10000;
    }
    .popup-backdrop.open { display: grid; }
    .call-popup {
      position: relative; width: 304px; padding: 18px 18px 20px; border-radius: 28px;
      background: rgba(17,24,39,.94); border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 20px 45px rgba(0,0,0,.45); color: #f8fafc; text-align: center;
    }
    .popup-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .back-btn {
      width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16);
      background: rgba(30,41,59,.9); color: #f8fafc; font-size: 18px; font-weight: 700;
      line-height: 1; display: grid; place-items: center; cursor: pointer;
    }
    .back-btn:active { transform: scale(.92); }
    .popup-title { flex: 1; text-align: left; padding-left: 10px; }
    .popup-title b { display: block; font-size: 15px; font-weight: 700; }
    .popup-title small { display: block; font-size: 11px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .call-menu.hidden { display: none; }
    .participants { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-bottom: 22px; }
    .participant { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; max-width: 84px; }
    .participant span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 84px; }
    .empty { font-size: 12px; color: #94a3b8; }
    .voice-bubble {
      --voice: 0; width: 60px; height: 60px; border-radius: 50%; padding: 3px;
      background: linear-gradient(135deg, rgba(56,189,248,.45), rgba(168,85,247,.4));
      border: 2px solid rgba(255,255,255,.55);
      box-shadow: 0 0 calc(var(--voice) * 20px) calc(var(--voice) * 4px) rgba(34,197,94,calc(var(--voice) * .95));
      transform: scale(calc(1 + var(--voice) * .14)); overflow: hidden;
    }
    .voice-bubble.speaking { border-color: rgba(74,222,128,.9); }
    .voice-bubble img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }

    .actions { display: flex; justify-content: center; gap: 18px; }
    .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #cbd5e1; width: 66px; }
    .circle-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none; display: grid; place-items: center;
      cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,.35); transition: transform .14s ease, background .16s ease;
    }
    .circle-btn:active { transform: scale(.92); }
    #btnDecline { background: #dc2626; color: #fff; }
    #btnShareScreen { background: #2563eb; color: #fff; }
    #btnShareScreen.sharing { background: #22c55e; color: #052e16; }
    #btnOpenChat { background: #334155; color: #f8fafc; }
    .circle-btn svg { width: 21px; height: 21px; fill: currentColor; }

    /* Khung chat */
    .chat-panel { display: none; flex-direction: column; gap: 10px; }
    .chat-panel.open { display: flex; }
    .chat-messages {
      height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px;
      border-radius: 20px; background: rgba(15,23,42,.72); border: 1px solid rgba(255,255,255,.1); text-align: left;
    }
    .msg-bubble { max-width: 82%; padding: 8px 12px; border-radius: 16px; font-size: 12px; line-height: 1.35; word-break: break-word; }
    .msg-peer { align-self: flex-start; background: rgba(30,41,59,.95); color: #e2e8f0; border-bottom-left-radius: 5px; }
    .msg-self { align-self: flex-end; background: #0068ff; color: #fff; border-bottom-right-radius: 5px; }
    .msg-name { display: block; font-size: 10px; opacity: .7; margin-bottom: 2px; }

    .zalo-input-bar {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 999px;
      background: rgba(30,41,59,.95); border: 1px solid rgba(255,255,255,.14);
    }
    #chatInput { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #f8fafc; font-size: 12.5px; }
    #chatInput::placeholder { color: #94a3b8; }
    #btnSendChat {
      width: 34px; height: 34px; border-radius: 50%; border: none; background: #0068ff; color: #fff;
      display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    }
    #btnSendChat svg { width: 16px; height: 16px; fill: currentColor; }
  </style>
</head>
<body>

  <!-- Bong bóng mini -->
  <div id="miniBubbleWrap">
    <div class="mini-float">
      <div class="mini-bubble" id="miniBubble">
        <img id="miniAvatar" src="" alt="Avatar" />
      </div>
      <span class="unread-badge" id="unreadBadge"></span>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup-backdrop" id="callPopupBackdrop">
    <div class="call-popup" role="dialog" aria-label="Cuộc gọi thoại">
      <div class="popup-top">
        <button id="btnBack" class="back-btn" type="button" aria-label="Trở về">&lt;</button>
        <div class="popup-title">
          <b id="popupTitle">Cuộc gọi thoại</b>
          <small id="roomLabel"></small>
        </div>
      </div>

      <div class="call-menu" id="callMenu">
        <div class="participants" id="participants"></div>

        <div class="actions">
          <div class="action-item">
            <button id="btnDecline" class="circle-btn" type="button" aria-label="Từ chối">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1-.29-.71c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
            <span>Từ chối</span>
          </div>

          <div class="action-item">
            <button id="btnShareScreen" class="circle-btn" type="button" aria-label="Chia sẻ màn hình">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6zm8 2-3.5 3.5 1.41 1.41L11 10.83V14h2v-3.17l1.09 1.08 1.41-1.41L12 8z"/></svg>
            </button>
            <span id="shareLabel">Chia sẻ màn hình</span>
          </div>

          <div class="action-item">
            <button id="btnOpenChat" class="circle-btn" type="button" aria-label="Chat">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
            </button>
            <span>Chat</span>
          </div>
        </div>
      </div>

      <div class="chat-panel" id="chatPanel">
        <div class="chat-messages" id="chatMessages"></div>
        <form class="zalo-input-bar" id="chatForm">
          <input id="chatInput" type="text" placeholder="Nhập tin nhắn..." autocomplete="off" />
          <button id="btnSendChat" type="submit" aria-label="Gửi tin nhắn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Cầu nối với Android: PopupBridge do CallPopupManager cung cấp.
    // Trên trình duyệt không có cầu nối nên các lệnh gọi bị bỏ qua.
    const native = window.PopupBridge;
    const send = (fn, ...args) => {
      if (native && typeof native[fn] === 'function') native[fn](...args);
    };

    const $ = id => document.getElementById(id);
    const miniWrap = $('miniBubbleWrap');
    const miniBubble = $('miniBubble');
    const miniAvatar = $('miniAvatar');
    const unreadBadge = $('unreadBadge');
    const popupBackdrop = $('callPopupBackdrop');
    const popupTitle = $('popupTitle');
    const roomLabel = $('roomLabel');
    const callMenu = $('callMenu');
    const chatPanel = $('chatPanel');
    const chatMessages = $('chatMessages');
    const chatForm = $('chatForm');
    const chatInput = $('chatInput');
    const btnShareScreen = $('btnShareScreen');
    const shareLabel = $('shareLabel');

    const BUBBLE_SIZE = 40;
    const EDGE_MARGIN = 6;
    const HALF_HIDDEN = 20;
    const IDLE_MS = 10000;
    const SPEAK_THRESHOLD = 0.02;

    const avatarOf = seed => `https://api.dicebear.com/9.x/avataaars/svg?seed=${encodeURIComponent(seed)}`;
    const visual = v => Math.min(1, Math.max(0, v * 3));   // mức âm thanh WebRTC thường nhỏ, khuếch đại để nhìn rõ

    let currentSide = 'right';
    let isPeeking = false;
    let idleTimer = null;
    let popupOpen = false;
    let chatMode = false;
    let unread = 0;
    let participants = [];
    let levels = {};

    // ---- Bong bóng mini ----

    function snapToEdge(side = currentSide, peek = false) {
      const sideChanged = side !== currentSide;
      currentSide = side;
      isPeeking = peek;

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const rect = miniWrap.getBoundingClientRect();
      const y = Math.max(10, Math.min(vh - BUBBLE_SIZE - 10, rect.top));

      miniWrap.style.top = `${y}px`;
      miniWrap.classList.toggle('is-peeking', peek);
      if (peek) {
        miniWrap.style.left = `${side === 'left' ? -HALF_HIDDEN : vw - HALF_HIDDEN}px`;
      } else {
        miniWrap.style.left = `${side === 'left' ? EDGE_MARGIN : vw - BUBBLE_SIZE - EDGE_MARGIN}px`;
      }
      if (sideChanged) send('setSide', side);
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      if (!popupOpen) {
        idleTimer = setTimeout(() => snapToEdge(currentSide, true), IDLE_MS);
      }
    }

    // Kéo bong bóng: có di chuyển thì kéo, không di chuyển thì mở popup
    let dragging = false;
    let moved = false;
    let offsetX = 0;
    let offsetY = 0;

    miniWrap.addEventListener('pointerdown', e => {
      if (popupOpen) return;
      clearTimeout(idleTimer);
      dragging = true;
      moved = false;
      miniWrap.classList.add('dragging');
      miniWrap.setPointerCapture(e.pointerId);
      if (isPeeking) snapToEdge(currentSide, false);
      const rect = miniWrap.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
    });

    miniWrap.addEventListener('pointermove', e => {
      if (!dragging) return;
      moved = true;
      const maxY = window.innerHeight - BUBBLE_SIZE - 10;
      miniWrap.style.left = `${e.clientX - offsetX}px`;
      miniWrap.style.top = `${Math.max(10, Math.min(maxY, e.clientY - offsetY))}px`;
    });

    miniWrap.addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      miniWrap.classList.remove('dragging');
      if (!moved) {
        openPopup();
        return;
      }
      const rect = miniWrap.getBoundingClientRect();
      const centerX = rect.left + BUBBLE_SIZE / 2;
      snapToEdge(centerX < window.innerWidth / 2 ? 'left' : 'right', false);
      resetIdleTimer();
    });

    // Cửa sổ native đổi kích thước khi mở/đóng popup: đặt lại vị trí bong bóng
    window.addEventListener('resize', () => {
      if (!popupOpen) snapToEdge(currentSide, isPeeking);
    });

    // ---- Mở / đóng popup ----

    function openPopup() {
      popupOpen = true;
      clearTimeout(idleTimer);
      send('setPopupOpen', true);
      popupBackdrop.classList.add('open');
      setChatMode(false);
      unread = 0;
      updateBadge();
    }

    function closePopup() {
      popupBackdrop.classList.remove('open');
      setChatMode(false);
      popupOpen = false;
      send('setPopupOpen', false);
      resetIdleTimer();
    }

    function setChatMode(on) {
      chatMode = on;
      callMenu.classList.toggle('hidden', on);
      chatPanel.classList.toggle('open', on);
      popupTitle.textContent = on ? 'Chat' : 'Cuộc gọi thoại';
      if (on) setTimeout(() => chatInput.focus(), 50);
    }

    $('btnBack').addEventListener('click', () => {
      if (chatMode) setChatMode(false);
      else closePopup();
    });

    $('btnOpenChat').addEventListener('click', () => setChatMode(true));

    $('btnDecline').addEventListener('click', () => {
      popupOpen = false;
      popupBackdrop.classList.remove('open');
      setChatMode(false);
      send('decline');
    });

    btnShareScreen.addEventListener('click', () => send('toggleShare'));

    chatForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      send('sendChat', text);   // tin hiện lên khi Android phát lại, không tự thêm ở đây
    });

    // ---- Hàm Android gọi vào ----

    function setRoom(roomId) {
      roomLabel.textContent = roomId ? `Phòng ${roomId}` : '';
    }

    // Danh sách người khác trong phòng: [{id, name}]
    function setParticipants(json) {
      participants = JSON.parse(json);
      renderParticipants();
    }

    function renderParticipants() {
      const box = $('participants');
      box.innerHTML = '';
      const all = [{ id: 'self', name: 'Bạn' }, ...participants];
      all.forEach(p => {
        const wrap = document.createElement('div');
        wrap.className = 'participant';
        const bubble = document.createElement('div');
        bubble.className = 'voice-bubble';
        bubble.dataset.voiceId = p.id;
        const img = document.createElement('img');
        img.src = avatarOf(p.id === 'self' ? 'me' : p.id);
        img.alt = p.name;
        bubble.appendChild(img);
        const name = document.createElement('span');
        name.textContent = p.name;
        wrap.append(bubble, name);
        box.appendChild(wrap);
      });
      if (participants.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Chưa có ai khác trong phòng';
        box.appendChild(empty);
      }
      applyLevels();
    }

    // Mức âm thanh từ WebRTC, 4 lần/giây: {"self":0.1, "<id>":0.0}
    function setVoiceLevels(json) {
      levels = JSON.parse(json);
      applyLevels();
    }

    function applyLevels() {
      let loudestId = 'self';
      let loudest = levels.self || 0;
      document.querySelectorAll('[data-voice-id]').forEach(el => {
        const lv = levels[el.dataset.voiceId] || 0;
        el.style.setProperty('--voice', visual(lv).toFixed(3));
        el.classList.toggle('speaking', lv > SPEAK_THRESHOLD);
        if (lv > loudest) {
          loudest = lv;
          loudestId = el.dataset.voiceId;
        }
      });
      // Bong bóng mini hiện người đang nói to nhất
      miniBubble.style.setProperty('--voice', visual(loudest).toFixed(3));
      miniAvatar.src = avatarOf(loudestId === 'self' ? 'me' : loudestId);
    }

    function setSharing(on) {
      btnShareScreen.classList.toggle('sharing', on);
      shareLabel.textContent = on ? 'Dừng chia sẻ' : 'Chia sẻ màn hình';
    }

    // Tin: {"name":"...","text":"...","self":false}
    function addChatMessage(json) {
      const m = JSON.parse(json);
      const div = document.createElement('div');
      div.className = `msg-bubble ${m.self ? 'msg-self' : 'msg-peer'}`;
      if (!m.self) {
        const who = document.createElement('span');
        who.className = 'msg-name';
        who.textContent = m.name;
        div.appendChild(who);
      }
      const txt = document.createElement('div');
      txt.textContent = m.text;
      div.appendChild(txt);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (!m.self && !popupOpen) {
        unread++;
        updateBadge();
      }
    }

    function updateBadge() {
      unreadBadge.textContent = unread > 9 ? '9+' : String(unread);
      unreadBadge.classList.toggle('show', unread > 0);
    }

    // ---- Khởi động ----
    window.addEventListener('load', () => {
      snapToEdge('right', false);
      resetIdleTimer();
      renderParticipants();
      applyLevels();
    });
  </script>
</body>
</html>
