<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lunaa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Bộ icon vẽ bằng SVG, không dùng ảnh hay emoji -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 L3 14 H11 L10 22 L21 9 H13 Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="M6 9 L12 15 L18 9"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9 6 L15 12 L9 18"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z"/><path d="M16 9 Q18 12 16 15"/><path d="M18.5 6.5 Q22 12 18.5 17.5"/></symbol>
    <symbol id="i-speaker-off" viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z"/><path d="M16 9 L22 15 M22 9 L16 15"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5 H20 V16 H9 L5 20 V16 H4 Z"/></symbol>
    <symbol id="i-add-user" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 20 C2 15 6 13 9 13 C12 13 16 15 16 20"/><path d="M19 8 V14 M16 11 H22"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 A7 7 0 0 0 19 11 M12 18 V22 M8 22 H16"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 A7 7 0 0 0 19 11 M12 18 V22 M8 22 H16 M3 3 L21 21"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20 H16 M12 16 V20"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.8" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-hangup" viewBox="0 0 24 24"><path d="M2 14 Q12 4 22 14 L19 17 L15 14 V11 Q12 10 9 11 V14 L5 17 Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 12 L21 4 L15 20 L11 13 Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M4 4 H9 L11 9 L8 11 Q9 14 13 16 L15 13 L20 15 V20 Q20 21 19 21 Q5 20 4 5 Z" fill="currentColor" stroke="none"/></symbol>
  </defs>
</svg>

<!-- Màn hình chính: vào/tạo phòng -->
<section id="lobby" class="screen">
  <header class="lobby-top">
    <h1>Phòng gọi</h1>
    <button class="round-btn" onclick="connectShizuku()" title="Shizuku"><svg class="ico"><use href="#i-bolt"/></svg></button>
  </header>

  <div class="lobby-body">
    <div class="card">
      <h2>Vào hoặc tạo phòng</h2>
      <p>Nhập mã phòng để vào. Để trống khi tạo phòng mới.</p>
      <input type="text" id="roomInput" class="input" placeholder="Mã phòng (VD: lunaa-123)" autocomplete="off">
      <div class="btn-row">
        <button class="btn btn-primary" onclick="createRoom()">Tạo phòng</button>
        <button class="btn btn-secondary" onclick="joinRoom()">Vào phòng</button>
      </div>
    </div>

    <div class="label">Chất lượng stream</div>
    <div class="chips">
      <button class="chip active" onclick="selectPreset('780p', this)">780p · 45fps</button>
      <button class="chip" onclick="selectPreset('480p', this)">480p · 30–15fps</button>
    </div>

    <div class="label">Tài khoản</div>
    <div class="user-row" onclick="changeAvatar()">
      <img id="userAvatar" class="avatar" src="" alt="">
      <div class="user-text"><b>Bạn</b><small>Nhấn để đổi avatar</small></div>
    </div>
  </div>

  <!-- Mini call: hiện khi đang trong phòng nhưng đã thu nhỏ -->
  <div id="miniCall" class="mini-call" onclick="expandCall()">
    <div class="mini-info">
      <div class="mini-room" id="miniRoom">RoomID</div>
      <div class="mini-time" id="miniTime">0:00</div>
    </div>
    <button class="round-btn" id="miniMicBtn" onclick="toggleMic(event)" title="Mic"></button>
    <button class="round-btn danger" onclick="leaveRoom(event)" title="Rời"><svg class="ico"><use href="#i-hangup"/></svg></button>
  </div>
</section>

<!-- Màn hình gọi, bố cục như Discord -->
<section id="callScreen" class="screen call">
  <header class="call-top">
    <button class="round-btn" onclick="minimizeCall()" title="Thu nhỏ"><svg class="ico"><use href="#i-chev-down"/></svg></button>
    <button class="pill" onclick="copyRoomId()"><span id="topbarRoom">Phòng</span><span class="chev"><svg class="ico"><use href="#i-chev-right"/></svg></span></button>
    <div class="top-right">
      <button class="round-btn" id="speakerBtn" onclick="toggleSpeaker()" title="Loa"></button>
      <button class="round-btn" onclick="toggleChat()" title="Trò chuyện"><svg class="ico"><use href="#i-chat"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <div class="tiles" id="tiles">
      <div class="tile" id="selfTile">
        <img id="callAvatar" class="tile-avatar" src="" alt="">
        <div class="name-pill">Bạn <span class="mic-state" id="tileMicState"></span></div>
      </div>
    </div>
    <div class="timer" id="callTimerText">Time: 0:00</div>
  </main>

  <div class="invite" onclick="copyRoomId()">
    <div><b>Mời người vào phòng</b><small>Chia sẻ mã <span id="inviteRoom">----</span></small></div>
    <span class="chev"><svg class="ico"><use href="#i-chev-right"/></svg></span>
  </div>

  <footer class="sheet" id="sheet">
    <div class="sheet-handle" onclick="toggleSheet()"></div>
    <div class="controls">
      <button class="ctrl" id="micBtn" onclick="toggleMic(event)" title="Mic"></button>
      <button class="ctrl" id="screenBtn" onclick="toggleScreenShare()" title="Chia sẻ màn hình"><svg class="ico"><use href="#i-screen"/></svg></button>
      <button class="ctrl" onclick="toggleSheet()" title="Thêm"><svg class="ico"><use href="#i-more"/></svg></button>
      <button class="ctrl hang" onclick="leaveRoom()" title="Rời cuộc gọi"><svg class="ico"><use href="#i-hangup"/></svg></button>
    </div>
    <div class="menu">
      <div class="menu-group">
        <div class="menu-item">
          <div><b>Tắt tiếng</b><small>Tắt micro, người khác vẫn thấy bạn trong phòng</small></div>
          <input type="checkbox" class="switch" id="swMute" onchange="setMicFromSwitch(this)">
        </div>
        <div class="menu-item" onclick="toggleChat()"><span>Trò chuyện</span><span class="chev"><svg class="ico"><use href="#i-chev-right"/></svg></span></div>
        <div class="menu-item" onclick="copyRoomId()"><span>Mời bạn bè</span><span class="chev"><svg class="ico"><use href="#i-chev-right"/></svg></span></div>
        <div class="menu-item" onclick="connectShizuku()"><span>Kết nối Shizuku</span><span class="chev"><svg class="ico"><use href="#i-chev-right"/></svg></span></div>
      </div>
    </div>
  </footer>

  <!-- Khung trò chuyện -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-head">
      <b>Trò chuyện</b>
      <button class="round-btn" onclick="toggleChat()" title="Đóng"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="chat-input-row">
      <input id="chatInput" class="input" placeholder="Nhắn trong phòng" autocomplete="off"
             onkeydown="if(event.key==='Enter')sendChatMessage()">
      <button class="round-btn send" onclick="sendChatMessage()" title="Gửi"><svg class="ico"><use href="#i-send"/></svg></button>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
