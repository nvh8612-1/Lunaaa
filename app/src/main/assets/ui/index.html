<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lunaa Call</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <nav class="rail">
    <div class="rail-logo" title="Lunaa">L</div>
    <div class="rail-sep"></div>
    <div class="rail-item active" title="Phòng gọi">📞</div>
    <div class="rail-item" title="Shizuku" onclick="connectShizuku()">⚡</div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">Lunaa Call</div>
    <div class="sidebar-scroll">
      <div class="section-label">Kênh thoại</div>
      <div class="channel active"><span class="icon">🔊</span>Phòng gọi</div>

      <div class="section-label">Chất lượng stream</div>
      <label class="radio-card active" onclick="selectPreset('780p', this)">
        <input type="radio" name="preset" value="780p" checked>
        <div><strong>780p @ 45fps</strong><p>Nét cao, stream game</p></div>
      </label>
      <label class="radio-card" onclick="selectPreset('480p', this)">
        <input type="radio" name="preset" value="480p">
        <div><strong>480p @ 30-15fps</strong><p>Tiết kiệm băng thông</p></div>
      </label>

      <div class="section-label">Tùy chọn</div>
      <div class="channel" onclick="connectShizuku()"><span class="icon">⚡</span>Kết nối Shizuku</div>
    </div>

    <div class="user-panel">
      <div class="avatar-wrap" onclick="changeAvatar()" title="Đổi avatar">
        <img id="userAvatar" src="" alt="Avatar">
        <span class="status-dot"></span>
      </div>
      <div class="user-meta">
        <div class="user-name">Bạn</div>
        <div class="user-sub">Trực tuyến</div>
      </div>
      <button class="icon-btn" id="muteBtn" onclick="toggleMute()" title="Tắt mic">🎤</button>
      <button class="icon-btn" id="deafenBtn" onclick="toggleDeafen()" title="Tắt tiếng">🎧</button>
    </div>
  </aside>
  <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn topbar-menu" onclick="toggleSidebar()" title="Kênh">☰</button>
      <div class="topbar-title"><span>#</span><span id="topbarRoom">Phòng gọi</span></div>
    </header>

    <section class="content">
      <div class="join-card">
        <h2>Vào hoặc tạo phòng</h2>
        <p>Nhập mã phòng để vào. Để trống khi tạo phòng mới.</p>
        <input type="text" id="roomInput" class="input" placeholder="Mã phòng (VD: lunaa-123)" autocomplete="off">
        <div class="btn-row">
          <button class="btn btn-primary" onclick="createRoom()">Tạo phòng</button>
          <button class="btn btn-secondary" onclick="joinRoom()">Vào phòng</button>
        </div>
      </div>
      <p class="hint">Chất lượng: <span id="presetLabel">780p @ 45fps</span></p>
    </section>

    <section class="call-card" id="callCard" style="display:none">
      <div class="call-info">
        <div class="call-status"><span class="pulse"></span>Đã kết nối thoại</div>
        <div class="call-room" id="roomStatusText">RoomID: ----</div>
        <div class="call-time" id="callTimerText">Time: 0:00</div>
      </div>
      <div class="call-actions">
        <button class="icon-btn" onclick="toggleScreenShare()" title="Chia sẻ màn hình">🖥️</button>
        <button class="icon-btn danger" onclick="leaveRoom()" title="Rời cuộc gọi">📞</button>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
